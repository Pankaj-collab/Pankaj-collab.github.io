<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Family Quest — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="styles.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Family Quest</div>
      <nav>
        <a class="nav-link active" href="./">Dashboard</a>
        <a class="nav-link" href="leaderboard.html">Leaderboard</a>
        <a class="nav-link" href="admin.html">Admin Panel</a>
      </nav>
      </aside>

    <main class="content">
      <header class="header">
        <h1 id="welcomeTitle">Welcome, Alex!</h1>
        <p class="sub">Here are your quests for this cycle. Complete them to earn XP!</p>
      </header>
      
      <div class="user-info-bar">
        <p class="sub-xp">XP this cycle: <span id="currentUserXP">0</span></p>
      </div>

      <section class="panel">
        <h2>Active Quests</h2>
        <div id="activeQuests" class="cards"></div>
      </section>

      <section class="panel">
        <h2>Completed Quests</h2>
        <div id="completedQuests" class="cards"></div>
      </section>
    </main>

    <div class="user-switch-bottom">
        <label for="userSelect">Current user</label>
        <select id="userSelect"></select>
    </div>

  </div>

  <template id="questCardTemplate">
    <div class="card quest">
      <div class="card-header">
        <div class="icon-placeholder"></div>
        <div class="title-wrap">
          <div class="title"></div>
          <div class="xp-badge"></div>
        </div>
      </div>
      <p class="desc"></p>
      <div class="actions">
        <button class="btn success complete">Mark as Complete</button>
        <span class="status"></span>
      </div>
    </div>
  </template>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.FQ.initDashboard();
    });
  </script>
</body>
</html>
